# Base44 development compose — runs the Next.js app from cloned source with
# live reload. Do not run the project's own production compose; this is the
# dev entry point used by the Base44 preview.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      # Persist installed node_modules across container restarts without
      # leaking them into the host checkout.
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults   # placeholders — app boots without credentials
      - /run/base44/app.env       # platform secrets — LAST, always wins
    environment:
      # Needed by next.config.mjs allowedDevOrigins to allow the preview origin.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    # Install pinned deps from the lockfile, then start the dev server bound to
    # all interfaces so the preview proxy can reach it.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  node_modules:
